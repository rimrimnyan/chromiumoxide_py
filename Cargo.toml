[package]
name = "chromiumoxide_py"
version = "0.1.0"
edition = "2024"
description = "Python bindings for chromiumoxide via PyO3"

[lib]
name = "chromiumoxide_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
chromiumoxide = { version = "0.9.1", features = [] }
chromiumoxide_cdp = "0.9.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
once_cell = "1"
serde_json = "1.0.149"

[features]
default = []
