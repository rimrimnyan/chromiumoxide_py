[package]
    name        = "chromiumoxide_py"
    version     = "0.1.1"
    edition     = "2024"
    description = "Python bindings for chromiumoxide"

[lib]
    crate-type = ["cdylib", "rlib"]

[[bin]]
    doc  = false
    name = "stub_gen"
    path = "src/bin/stub_gen.rs"

[dependencies]
    chromiumoxide     = { version = "0.9.1", features = [] }
    chromiumoxide_cdp = "0.9.1"
chromiumoxide_types = "0.9.1"
    env_logger        = "0.11.10"
    futures           = "0.3"
    once_cell         = "1"
    pyo3              = { version = "0.28.3" }
    pyo3-stub-gen     = "0.21.2"
    serde_json        = "1.0.149"
    tokio             = { version = "1", features = ["full"] }

[features]
    default          = []
    extension-module = ["pyo3/extension-module"]
