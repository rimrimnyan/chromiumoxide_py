[project]
    name            = "chromiumoxide_py"
    requires-python = ">=3.10"
    dynamic         = ["version"]

[build-system]
    requires      = ["maturin>=1.5,<2.0"]
    build-backend = "maturin"

[tool.maturin]
    features      = ["pyo3/extension-module"]
    # The Rust crate name must match [lib] name in Cargo.toml
    module-name   = "chromiumoxide_py.bindings"
    # Build in release mode (recommended for distribution)
    profile       = "release"
    python-source = "python"
